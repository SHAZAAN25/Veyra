name: VEYRA CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Integrity Verification (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pillow pytest pyinstaller

      - name: Verify locked branding asset integrity
        run: |
          python app/core/branding.py

      - name: Run automated test suite
        run: |
          python -m pytest tests/ -v
